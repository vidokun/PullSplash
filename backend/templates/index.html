<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PullSplash — Unsplash Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { unsplash: '#000000', accent: '#e44232' }
                }
            }
        }
    </script>
    <style>
        .photo-card:hover .photo-overlay { opacity: 1; }
        .photo-overlay { opacity: 0; transition: opacity 0.2s; }
        .selected-ring { box-shadow: 0 0 0 3px #e44232; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-fade { animation: fadeIn 0.2s ease-out; }
        #splash-screen { transition: opacity 0.5s ease; }
        #splash-screen.hide { opacity: 0; pointer-events: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgb(63 63 70); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgb(82 82 91); }
        @media (max-width: 767px) {
            #sidebar { transform: translateX(-100%); transition: transform 0.25s ease; }
            #sidebar.open { transform: translateX(0); }
            #sidebar-backdrop { opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
            #sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

<div id="update-banner" class="hidden fixed top-0 inset-x-0 z-50 bg-accent/10 border-b border-accent/30 px-4 py-2.5 flex items-center justify-center gap-3 text-sm backdrop-blur-sm">
    <span id="update-banner-msg" class="text-accent"></span>
    <a id="update-banner-link" href="#" target="_blank"
       class="bg-accent hover:bg-red-700 text-white text-xs font-medium px-3 py-1 rounded transition-colors">Download</a>
    <button onclick="document.getElementById('update-banner').classList.add('hidden')"
            class="text-zinc-500 hover:text-zinc-200 text-lg leading-none ml-2">×</button>
</div>

<div id="splash-screen" class="fixed inset-0 z-[100] bg-zinc-950 flex flex-col items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-20 h-20">
        <path d="M24 4c-2 12-20 16-20 28 0 8 9 12 20 12s20-4 20-12c0-12-18-16-20-28z" fill="#e44232"/>
        <path d="M24 18v14M18 26l6 6 6-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 class="text-3xl font-bold mt-5 tracking-tight"><span class="text-accent">Pull</span>Splash</h1>
    <div class="border border-zinc-700 rounded-md px-3 py-1 mt-3">
        <span class="text-xs text-zinc-500 tracking-widest">V.1</span>
    </div>
    <p class="text-zinc-700 text-xs mt-8">by Vidokun.com</p>
</div>

<div id="app" class="flex h-screen">

    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/60 z-30" onclick="closeSidebar()"></div>

    <div id="sidebar" class="w-80 shrink-0 bg-zinc-900 border-r border-zinc-800 overflow-y-auto
            max-md:fixed max-md:inset-y-0 max-md:left-0 max-md:z-40">
        <div class="p-5 flex flex-col gap-6 min-h-full">

            <header>
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-7 h-7 shrink-0">
                        <path d="M24 4c-2 12-20 16-20 28 0 8 9 12 20 12s20-4 20-12c0-12-18-16-20-28z" fill="#e44232"/>
                        <path d="M24 18v14M18 26l6 6 6-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1 class="text-2xl font-bold tracking-tight"><span class="text-accent">Pull</span>Splash</h1>
                </div>
                <p class="text-zinc-500 text-xs mt-1">Pull photos from Unsplash</p>
            </header>

            <div id="api-key-section">
                <h2 class="text-sm font-medium text-zinc-300 mb-3">API Key</h2>
                <p class="text-zinc-500 text-xs mb-3">
                    Get a free key at <a href="https://unsplash.com/developers" target="_blank" class="text-accent underline">unsplash.com/developers</a>
                </p>
                <input id="api-key-input" type="text" placeholder="Paste your Access Key"
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent mb-3">
                <button onclick="saveApiKey()"
                        class="w-full bg-accent hover:bg-red-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
                    Save
                </button>
                <p id="api-key-error" class="text-red-400 text-xs mt-2 hidden"></p>
            </div>

            <div id="search-section" class="hidden">
                <h2 class="text-sm font-medium text-zinc-300 mb-3">Search</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1">Keyword</label>
                        <input id="search-query" type="text" placeholder="nature, cat, blue car..."
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent"
                               onkeydown="if(event.key==='Enter')doSearch()">
                    </div>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="block text-xs text-zinc-500 mb-1">Count</label>
                            <input id="search-count" type="number" value="20" min="1" max="50"
                                   class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-accent">
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-zinc-500 mb-1">Orientation</label>
                            <select id="search-orientation"
                                    class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-accent">
                                <option value="">Mixed</option>
                                <option value="landscape">Landscape</option>
                                <option value="portrait">Portrait</option>
                                <option value="squarish">Squarish</option>
                            </select>
                        </div>
                    </div>
                    <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
                        <input id="search-featured" type="checkbox" class="accent-accent w-3.5 h-3.5"> Featured only
                    </label>
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1">Collection URL</label>
                        <input id="search-collection" type="text" placeholder="unsplash.com/collections/..."
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent">
                    </div>
                    <button onclick="doSearch()"
                            class="w-full bg-accent hover:bg-red-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
                        Search
                    </button>
                </div>
            </div>

            <div id="download-section" class="hidden">
                <h2 class="text-sm font-medium text-zinc-300 mb-3">Download</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1">Format</label>
                        <select id="dl-format"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-accent">
                            <option value="">Original</option>
                            <option value="jpg">JPG</option>
                            <option value="png">PNG</option>
                            <option value="webp">WebP</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1">Quality (1-100)</label>
                        <input id="dl-quality" type="number" min="1" max="100" placeholder="100"
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1">Resize</label>
                        <div class="flex gap-2">
                            <input id="dl-resize" type="number" min="1" placeholder="Original"
                                   class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent">
                            <select id="dl-resize-mode"
                                    class="bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-accent">
                                <option value="width">wide</option>
                                <option value="height">tall</option>
                            </select>
                        </div>
                    </div>
                    <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
                        <input id="dl-naming" type="checkbox" checked class="accent-accent w-3.5 h-3.5"> Author-ID naming
                    </label>
                    <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
                        <input id="dl-credits" type="checkbox" checked class="accent-accent w-3.5 h-3.5"> Export credits
                    </label>
                    <div class="space-y-2">
                    <button onclick="doDownload()"
                            class="w-full bg-accent hover:bg-red-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
                        Download
                    </button>
                    </div>
                    <p id="download-status" class="text-zinc-500 text-xs hidden"></p>
                </div>
            </div>

            <div class="mt-auto pt-4">
                <button onclick="openSettings()" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Settings
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-w-0">
        <div id="mobile-bar" class="hidden max-md:flex items-center justify-between px-4 py-3 border-b border-zinc-800">
            <button onclick="openSidebar()" class="text-zinc-400 hover:text-zinc-200 text-sm">☰ Menu</button>
            <span class="text-sm font-medium"><span class="text-accent">Pull</span>Splash</span>
            <span class="text-xs text-zinc-500" id="selected-badge"></span>
        </div>

        <div class="flex-1 overflow-y-auto px-4 py-6">
            <div id="loading" class="hidden text-center py-12">
                <div class="spinner inline-block w-8 h-8 border-2 border-zinc-600 border-t-accent rounded-full"></div>
                <p class="text-zinc-500 mt-3 text-sm">Searching Unsplash...</p>
            </div>
            <div id="error-msg" class="hidden bg-red-900/30 border border-red-800 rounded-xl p-4 text-red-300 text-sm mb-4"></div>

            <div id="results-area" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <p id="results-count" class="text-zinc-500 text-sm"></p>
                    <div class="flex gap-2">
                        <button onclick="selectAll()" class="text-xs text-zinc-400 hover:text-zinc-200 px-3 py-1 border border-zinc-700 rounded-lg transition-colors">Select All</button>
                        <button onclick="deselectAll()" class="text-xs text-zinc-400 hover:text-zinc-200 px-3 py-1 border border-zinc-700 rounded-lg transition-colors">Deselect</button>
                    </div>
                </div>
                <div id="photo-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3"></div>
            </div>

            <div id="empty-state" class="flex items-center justify-center h-full text-center py-20">
                <div>
                    <p class="text-zinc-600 text-lg mb-2">No photos yet</p>
                    <p class="text-zinc-700 text-sm">Enter a keyword and click Search</p>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="view-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-fade"
     onclick="closeView()">
    <div class="absolute inset-0 bg-black/90"></div>
    <div class="relative z-10 max-w-[95vw] max-h-[95vh] flex flex-col items-center"
         onclick="event.stopPropagation()">
        <button onclick="closeView()"
                class="absolute -top-10 right-0 text-white/70 hover:text-white text-2xl leading-none p-2 transition-colors">×</button>
        <img id="view-modal-img" src="" alt=""
             class="max-w-[95vw] max-h-[85vh] object-contain rounded-lg shadow-2xl" style="animation: fadeIn 0.3s ease-out">
        <p id="view-modal-credit" class="text-zinc-400 text-sm mt-3"></p>
    </div>
</div>

<div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-fade"
     onclick="closeSettings()">
    <div class="absolute inset-0 bg-black/70"></div>
    <div class="relative z-10 bg-zinc-900 border border-zinc-800 rounded-xl p-6 w-full max-w-sm mx-4"
         onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-medium">Settings</h2>
            <button onclick="closeSettings()" class="text-zinc-500 hover:text-zinc-200 text-xl leading-none p-1">×</button>
        </div>
        <p class="text-zinc-500 text-xs mb-3">Manage your Unsplash API key.</p>
        <input id="settings-api-key" type="text" placeholder="New API Access Key"
               class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent mb-3">
        <button onclick="updateApiKey()"
                class="w-full bg-accent hover:bg-red-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm mb-3">
            Update Key
        </button>
        <button onclick="resetApiKey()"
                class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-zinc-200 font-medium py-2.5 rounded-lg transition-colors text-sm">
            Reset API Key & Restart
        </button>
        <p id="settings-status" class="text-xs text-zinc-500 mt-3 hidden"></p>
    </div>
</div>

<script>
const API = '';
let selectedPhotos = new Set();

function isDesktop() { return window.innerWidth >= 768; }

async function init() {
    // Splash screen auto-hide after 2.5s
    setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) { splash.classList.add('hide'); setTimeout(() => splash.remove(), 500); }
    }, 2500);

    checkForUpdates();

    try {
        const res = await fetch(`${API}/api/auth/status`);
        if ((await res.json()).configured) showSearchUI();
    } catch (e) { showError('Cannot connect to backend.'); }
}

async function checkForUpdates() {
    try {
        const res = await fetch(`${API}/api/update/check`);
        const data = await res.json();
        if (data.update_available) {
            const banner = document.getElementById('update-banner');
            document.getElementById('update-banner-msg').textContent =
                `v${data.current_version} → v${data.latest_version} available`;
            document.getElementById('update-banner-link').href = data.download_url;
            banner.classList.remove('hidden');
        }
    } catch (e) { /* silently ignore — update check is non-critical */ }
}

function showSearchUI() {
    document.getElementById('api-key-section').classList.add('hidden');
    document.getElementById('search-section').classList.remove('hidden');
    document.getElementById('download-section').classList.remove('hidden');
}

async function saveApiKey() {
    const key = document.getElementById('api-key-input').value.trim();
    if (!key) return;
    const errEl = document.getElementById('api-key-error');
    try {
        const res = await fetch(`${API}/api/auth/key`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_key: key }),
        });
        if (res.ok) { showSearchUI(); errEl.classList.add('hidden'); }
        else { errEl.textContent = 'Failed to save.'; errEl.classList.remove('hidden'); }
    } catch (e) { errEl.textContent = 'Connection error.'; errEl.classList.remove('hidden'); }
}

async function doSearch() {
    const query = document.getElementById('search-query').value.trim();
    const collection = document.getElementById('search-collection').value.trim();
    if (!query && !collection) return;
    const count = parseInt(document.getElementById('search-count').value) || 20;
    const orientation = document.getElementById('search-orientation').value;
    const featured = document.getElementById('search-featured').checked;
    showLoading(true); hideError();
    document.getElementById('results-area').classList.add('hidden');
    document.getElementById('empty-state').classList.add('hidden');
    selectedPhotos.clear(); updateSelectedBadge();
    if (!isDesktop()) closeSidebar();
    try {
        const res = await fetch(`${API}/api/search`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, count, orientation, featured, collection_url: collection }),
        });
        if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Search failed'); }
        renderResults(await res.json());
    } catch (e) { showError(e.message); }
    finally { showLoading(false); }
}

function renderResults(data) {
    document.getElementById('results-area').classList.remove('hidden');
    document.getElementById('results-count').textContent = `Found ${data.total} photos`;
    document.getElementById('photo-grid').innerHTML = data.photos.map(p => `
        <div class="photo-card relative bg-zinc-900 rounded-lg overflow-hidden border-2 border-transparent hover:border-zinc-700"
             data-photo-id="${p.id}" data-raw-url="${p.raw_url}"
             data-photographer="${p.photographer}" data-description="${p.description || ''}">
            <div onclick="togglePhoto(this.closest('.photo-card').dataset.photoId, this.closest('.photo-card'))"
                 class="cursor-pointer relative">
                <img src="${p.thumb_url}" alt="${p.description || ''}" class="w-full aspect-[4/3] object-cover" loading="lazy">
                <div class="photo-overlay absolute inset-0 bg-black/50 flex items-center justify-center">
                    <div class="w-6 h-6 rounded-full border-2 border-white flex items-center justify-center">
                        <div class="w-3 h-3 rounded-full bg-accent hidden check-mark"></div>
                    </div>
                </div>
            </div>
            <div class="p-2">
                <p class="text-xs text-zinc-400 truncate">${p.photographer}</p>
                <button class="view-btn mt-1 text-xs text-zinc-500 hover:text-zinc-200 transition-colors cursor-pointer"
                        onclick="viewPhoto(this.closest('.photo-card'))">View</button>
            </div>
        </div>`).join('');
}

function togglePhoto(id, el) {
    if (selectedPhotos.has(id)) { selectedPhotos.delete(id); el.classList.remove('selected-ring'); el.querySelector('.check-mark').classList.add('hidden'); }
    else { selectedPhotos.add(id); el.classList.add('selected-ring'); el.querySelector('.check-mark').classList.remove('hidden'); }
    updateSelectedBadge();
}

function selectAll() {
    document.querySelectorAll('#photo-grid .photo-card').forEach(card => {
        selectedPhotos.add(card.dataset.photoId);
        card.classList.add('selected-ring'); card.querySelector('.check-mark').classList.remove('hidden');
    });
    updateSelectedBadge();
}

function deselectAll() {
    selectedPhotos.clear();
    document.querySelectorAll('#photo-grid .photo-card').forEach(card => {
        card.classList.remove('selected-ring'); card.querySelector('.check-mark').classList.add('hidden');
    });
    updateSelectedBadge();
}

function updateSelectedBadge() {
    const badge = document.getElementById('selected-badge');
    badge.textContent = selectedPhotos.size ? `${selectedPhotos.size} selected` : '';
}

function viewPhoto(card) {
    document.getElementById('view-modal-img').src = card.dataset.rawUrl;
    document.getElementById('view-modal-img').alt = card.dataset.description || '';
    document.getElementById('view-modal-credit').textContent = `Photo by ${card.dataset.photographer}`;
    document.getElementById('view-modal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeView() {
    document.getElementById('view-modal').classList.add('hidden');
    document.getElementById('view-modal-img').src = '';
    document.body.style.overflow = '';
}

function openSettings() {
    document.getElementById('settings-modal').classList.remove('hidden');
    document.getElementById('settings-api-key').value = '';
    document.getElementById('settings-status').classList.add('hidden');
    document.body.style.overflow = 'hidden';
}

function closeSettings() {
    document.getElementById('settings-modal').classList.add('hidden');
    document.body.style.overflow = '';
}

async function updateApiKey() {
    const key = document.getElementById('settings-api-key').value.trim();
    if (!key) return;
    const statusEl = document.getElementById('settings-status');
    statusEl.classList.remove('hidden');
    statusEl.className = 'text-xs text-zinc-400';
    statusEl.textContent = 'Saving...';
    try {
        const res = await fetch(`${API}/api/auth/key`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_key: key }),
        });
        if (res.ok) {
            statusEl.className = 'text-xs text-green-400';
            statusEl.textContent = 'API key updated.';
            setTimeout(closeSettings, 800);
        } else {
            statusEl.className = 'text-xs text-red-400';
            statusEl.textContent = 'Failed to save key.';
        }
    } catch (e) {
        statusEl.className = 'text-xs text-red-400';
        statusEl.textContent = 'Connection error.';
    }
}

function resetApiKey() {
    fetch(`${API}/api/auth/key`, { method: 'DELETE' }).catch(() => {});
    location.reload();
}

function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-backdrop').classList.remove('open');
    document.body.style.overflow = '';
}

function getProcessingOptions() {
    const format = document.getElementById('dl-format').value;
    const q = document.getElementById('dl-quality').value;
    const quality = q ? parseInt(q) : null;
    const r = document.getElementById('dl-resize').value;
    const resize = r ? parseInt(r) : null;
    const mode = document.getElementById('dl-resize-mode').value;
    return {
        output_format: format, quality,
        resize_width: mode === 'width' ? resize : null,
        resize_height: mode === 'height' ? resize : null,
    };
}

function dlStatus(msg, cls) {
    const el = document.getElementById('download-status');
    el.classList.remove('hidden'); el.className = 'text-xs ' + cls; el.textContent = msg;
}

async function doDownload() {
    if (selectedPhotos.size === 0) return;
    const naming = document.getElementById('dl-naming').checked ? 0 : 1;
    const saveCredits = document.getElementById('dl-credits').checked;
    const proc = getProcessingOptions();
    dlStatus(`Saving ${selectedPhotos.size} photos to Downloads...`, 'text-zinc-400');
    try {
        const res = await fetch(`${API}/api/download`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ photo_ids: [...selectedPhotos], name_scheme: naming, save_credits: saveCredits, ...proc }),
        });
        const data = await res.json();
        if (data.success) dlStatus(`Saved ${data.downloaded} photos to Downloads/PullSplash.`, 'text-green-400');
        else dlStatus(`Saved ${data.downloaded}, failed ${data.failed.length}.`, 'text-yellow-400');
    } catch (e) { dlStatus('Failed: ' + e.message, 'text-red-400'); }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (!document.getElementById('settings-modal').classList.contains('hidden')) closeSettings();
        else if (!document.getElementById('view-modal').classList.contains('hidden')) closeView();
        else if (!isDesktop() && document.getElementById('sidebar').classList.contains('open')) closeSidebar();
    }
});

function showLoading(show) { document.getElementById('loading').classList.toggle('hidden', !show); }
function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = msg; el.classList.remove('hidden'); }
function hideError() { document.getElementById('error-msg').classList.add('hidden'); }

init();
</script>
